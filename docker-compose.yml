# Runs anywhere Docker runs (home machine, Oracle Cloud Always Free VM, any VPS).
#   APP_PASSWORD=choose-one docker compose up -d --build     then open http://localhost:8080 (user: laa)
services:
  laa-pi:
    build: .
    image: laa-pi:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8080}:8080"
    environment:
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD (dashboard login password)}
      APP_USER: ${APP_USER:-laa}
      TZ: Asia/Kolkata
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - laa-data:/app/data
    shm_size: "1gb"

volumes:
  laa-data:
