[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:xvfb]
command=Xvfb :99 -screen 0 1366x900x24 -nolisten tcp -ac
user=app
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:x11vnc]
; localhost only: reachable solely through Caddy (password protected) via websockify
command=bash -c 'until [ -e /tmp/.X11-unix/X99 ]; do sleep 0.5; done; exec x11vnc -display :99 -forever -shared -nopw -localhost -rfbport 5900 -quiet -noxdamage'
user=app
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:novnc]
command=websockify --web /usr/share/novnc 127.0.0.1:6080 127.0.0.1:5900
user=app
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:streamlit]
command=/app/.venv/bin/streamlit run app.py --server.port 8501 --server.address 127.0.0.1
directory=/app
user=app
environment=HOME="/home/app",DISPLAY=":99"
priority=40
autorestart=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:scheduler]
command=/app/.venv/bin/python scheduler.py
directory=/app
user=app
environment=HOME="/home/app",DISPLAY=":99"
priority=50
autorestart=true
startsecs=5
stopsignal=TERM
stopwaitsecs=20
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:caddy]
command=caddy run --config /app/deploy/Caddyfile --adapter caddyfile
user=app
environment=HOME="/home/app",XDG_DATA_HOME="/home/app/.local/share",XDG_CONFIG_HOME="/home/app/.config"
priority=60
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
